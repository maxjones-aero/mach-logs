[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mach-logs"
version = "0.1.0"
description = "Parse and visualize ArduPilot DataFlash flight logs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Max Jones" }]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pymavlink>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
mach-logs = "mach_logs.cli:main"

[tool.setuptools.package-data]
mach_logs = ["assets/*.png"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
